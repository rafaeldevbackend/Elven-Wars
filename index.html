<!-- index.html -->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Protótipo - Perjuangan Semut style</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #222 url("assets/elven-wars-bg.png") center center / cover no-repeat;
      color: #fff;
    }
    .logo-header {
      display: flex;
      justify-content: center;
      padding: 1rem 1rem 0;
      position: relative;
      z-index: 1;
    }
    .logo-header img {
      max-width: min(150px, 90vw);
      height: auto;
      display: block;
    }
    #game {
      display: block;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <header class="logo-header">
    <img src="assets/elven-wars-logo.png" alt="Elven Wars" width="480" />
  </header>
  <div id="game"></div>
  <script src="main.js"></script>
</body>
</html>
